[project]
name = "pokedex-api"
version = "0.1.0"
description = "FastAPI service and PokeAPI mirror for the Pokédex project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "orjson>=3.10",
  "pillow>=11.0",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "tenacity>=9.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
]

[project.scripts]
pokedex-sync = "pokedex_api.sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokedex_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
